name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: "Tests (offline: mock models, no API key, no billed calls)"
        working-directory: backend
        env:
          QCANVAS_MODEL_PROVIDER: mock
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build
        working-directory: frontend
        run: npm ci && npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Browser
        run: python -m playwright install --with-deps chromium
      - name: "End to end in Chromium (offline models): every section, a sketch to verified code, the guided tour, phone width"
        run: python -m pytest e2e -q
      - name: Server log
        if: failure()
        run: cat e2e/server.log
